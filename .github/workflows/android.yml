# Builds the AudioScribe companion APK on GitHub (no Android Studio needed).
# Push this folder to a GitHub repository, open Actions -> "Android companion" -> Run workflow,
# then download the APK from the run's Artifacts and open it on your phone.
name: Android companion
on:
  workflow_dispatch:
  push:
    paths: ["audioscribe/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: companion/android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AudioScribe-companion
          path: companion/android/app/build/outputs/apk/release/*.apk
