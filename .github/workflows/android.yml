# Builds the AudioScribe companion APK on GitHub (no Android Studio needed).
# Push this folder to a GitHub repository, open Actions -> "Android companion" -> Run workflow,
# then download the APK from the run's Artifacts and open it on your phone.
name: Android companion
on:
  workflow_dispatch:
  push:
    paths: ["companion/**"]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # run every action on Node 24 (setup-android still says Node 20)
jobs:
  build:
    runs-on: ubuntu-24.04   # pinned, so the move to Ubuntu 26 doesn't change the build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: companion/android
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: AudioScribe-companion
          path: companion/android/app/build/outputs/apk/release/*.apk
