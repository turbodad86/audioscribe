<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AudioScribe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#111418;--side:#14181D;--card:#171C22;--box:#1D232B;--border:#262C34;--text:#E7EAEE;--muted:#9AA4AF;
  --accent:#F2A33A;--on:#111418;--accentText:#F2A33A;--hl:rgba(242,163,58,.22);--mark:rgba(242,163,58,.38);
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#F4F5F7;--side:#F7F8FA;--card:#FFFFFF;--box:#F0F2F5;--border:#DDE1E6;--text:#1B1F24;
    --muted:#5B6470;--accent:#C2410C;--on:#FFFFFF;--accentText:#B13B0A;--hl:rgba(194,65,12,.14);--mark:rgba(194,65,12,.26)}
}
:root[data-theme="light"]{--bg:#F4F5F7;--side:#F7F8FA;--card:#FFFFFF;--box:#F0F2F5;--border:#DDE1E6;--text:#1B1F24;
  --muted:#5B6470;--accent:#C2410C;--on:#FFFFFF;--accentText:#B13B0A;--hl:rgba(194,65,12,.14);--mark:rgba(194,65,12,.26)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--box);border:1px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.accent{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.icon{width:46px;height:46px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
button.big{width:64px;height:64px;font-size:22px;background:var(--accent);color:var(--on);border:none}
input,select{background:var(--box);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%}
.hide{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;
  padding-top:max(12px,env(safe-area-inset-top));background:var(--side);border-bottom:1px solid var(--border)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;flex:none}
main{padding:14px 16px 120px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stack>*+*{margin-top:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{white-space:nowrap;border-radius:20px;padding:6px 14px;font-size:14px}
.tabs button.on{background:var(--hl);border-color:var(--accent);color:var(--accentText)}
.book{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);margin-bottom:10px;cursor:pointer}
.cover{width:54px;height:80px;border-radius:6px;flex:none;background:var(--box);object-fit:cover;display:flex;
  align-items:flex-end;padding:5px;font:600 9px/1.1 var(--serif);overflow:hidden}
.book .meta{flex:1;min-width:0}
.book .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--box);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--box);color:var(--muted);margin-right:4px}
.tag.on{background:var(--hl);color:var(--accentText)}
#reader{font:19px/1.6 var(--serif);padding:8px 2px 40px;max-width:720px;margin:0 auto}
#reader h2{font:600 22px/1.3 var(--serif);margin:26px 0 14px}
#reader p{margin:0 0 .9em}
#reader s{text-decoration:none;border-radius:4px;transition:background .15s}
#reader s.now{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
#reader s.hl{background:var(--mark)}
#reader s.bm{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--side);border-top:1px solid var(--border);
  padding:8px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.player .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.player .times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{padding:0;height:28px;background:transparent;border:none;accent-color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-height:75vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;
  padding-bottom:max(16px,env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px}
.item{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item.cur{color:var(--accentText);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:30;background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.92}
.pill{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--box);color:var(--muted)}
.pill.ok{color:var(--accentText);background:var(--hl)}
.progress{height:6px;background:var(--box);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{text-align:left}
</style>
</head>
<body>
<header>
  <svg class="logo" id="logo" viewBox="0 0 64 64" aria-hidden="true"></svg>
  <button class="ghost icon hide" id="back" aria-label="Back">&#8249;</button>
  <h1 id="title">AudioScribe</h1>
  <span class="pill" id="net">offline</span>
  <button class="ghost icon" id="more" aria-label="Menu">&#8942;</button>
</header>

<main id="v-connect" class="hide">
  <div class="card stack">
    <h2 style="margin:0">Connect to your PC</h2>
    <p class="muted small" style="margin:0">On the PC, open AudioScribe and press <b>Phone</b> &rarr; <b>Start sharing</b>.
      Both need to be on the same Wi-Fi.</p>
    <label class="small muted" id="addr-l">PC address</label>
    <input id="addr" inputmode="url" placeholder="http://192.168.1.20:8765">
    <label class="small muted">Pairing code</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="6 digits" autocomplete="one-time-code">
    <button class="accent" id="pair" style="width:100%">Connect</button>
    <p class="small" id="pair-msg" style="margin:0;color:var(--accentText)"></p>
    <button class="ghost small" id="skip" style="width:100%">Use downloaded books only</button>
  </div>
</main>

<main id="v-lib" class="hide">
  <div class="tabs" id="shelves"></div>
  <div id="books"></div>
  <p class="muted small" id="lib-msg"></p>
</main>

<main id="v-book" class="hide">
  <div id="reader"></div>
</main>

<div class="player hide" id="player">
  <div class="times"><span id="t-cur">0:00</span><span id="t-ch" class="muted"></span><span id="t-left">-0:00</span></div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in chapter">
  <div class="row">
    <button class="ghost icon" id="b-chapters" aria-label="Chapters">&#9776;</button>
    <button class="ghost icon" id="b-prev" aria-label="Previous chapter">&#9198;</button>
    <button class="ghost icon" id="b-back" aria-label="Back 30 seconds">&#8634;30</button>
    <button class="icon big" id="b-play" aria-label="Play">&#9654;</button>
    <button class="ghost icon" id="b-fwd" aria-label="Forward 30 seconds">30&#8635;</button>
    <button class="ghost icon" id="b-next" aria-label="Next chapter">&#9197;</button>
    <button class="ghost icon" id="b-opts" aria-label="Speed, sleep timer and bookmarks">&#9881;</button>
  </div>
</div>

<div class="sheet hide" id="sheet"><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
"use strict";
// ---------------------------------------------------------------- tiny helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const LS = { get(k, d) { try { const v = localStorage.getItem("as." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem("as." + k, JSON.stringify(v)); } catch (e) {} } };
let toastT = 0;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
const COVER_COLS = [["#2E4057","#F4D35E"],["#5C3D2E","#F2D0A4"],["#1B4332","#D8F3DC"],["#3D0C11","#F5CAC3"],["#22223B","#F2E9E4"],["#264653","#E9C46A"],["#4A4E69","#FFE8D6"],["#6D2E46","#ECE2D0"]];
function coverCols(t) { let h = 0; for (const c of t || "") h = (h * 31 + c.charCodeAt(0)) >>> 0; return COVER_COLS[h % COVER_COLS.length]; }

// the quill mark (same drawing as the desktop app)
fetch("icon.svg").then((r) => r.ok ? r.text() : "").then((s) => { const m = s.match(/<svg[^>]*>([\s\S]*)<\/svg>/); if (m) $("logo").innerHTML = m[1]; }).catch(() => {});

// ---------------------------------------------------------------- storage (IndexedDB: works without HTTPS)
const DB = { db: null,
  open() { return this.db ? Promise.resolve(this.db) : new Promise((ok, bad) => {
    const r = indexedDB.open("audioscribe", 1);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ["books", "audio", "covers", "state"]) d.createObjectStore(s); };
    r.onsuccess = () => { this.db = r.result; ok(this.db); }; r.onerror = () => bad(r.error); }); },
  async get(store, key) { const d = await this.open(); return new Promise((ok, bad) => { const q = d.transaction(store).objectStore(store).get(key); q.onsuccess = () => ok(q.result); q.onerror = () => bad(q.error); }); },
  async put(store, key, val) { const d = await this.open(); return new Promise((ok, bad) => { const tx = d.transaction(store, "readwrite"); tx.objectStore(store).put(val, key); tx.oncomplete = () => ok(); tx.onerror = () => bad(tx.error); }); },
  async del(store, key) { const d = await this.open(); return new Promise((ok) => { const tx = d.transaction(store, "readwrite"); tx.objectStore(store).delete(key); tx.oncomplete = () => ok(); tx.onerror = () => ok(); }); },
  async keys(store) { const d = await this.open(); return new Promise((ok) => { const q = d.transaction(store).objectStore(store).getAllKeys(); q.onsuccess = () => ok(q.result || []); q.onerror = () => ok([]); }); },
};

// ---------------------------------------------------------------- server
const SAME_ORIGIN = /^https?:$/.test(location.protocol) && !/appassets\.androidplatform\.net$/.test(location.host);
const S = {
  home() { return (LS.get("server", "") || (SAME_ORIGIN ? location.origin : "")).replace(/\/+$/, ""); },
  away() { return (LS.get("away", "") || "").replace(/\/+$/, ""); },
  base() { return LS.get("use_away", false) && this.away() ? this.away() : this.home(); },
  token() { return LS.get("token", ""); },
  online: false,
  async api(path, opts = {}) {
    try { return await this.api1(path, opts); }
    catch (e) {                                   // can't reach it: try the other address (home Wi-Fi / Tailscale)
      if (e.status || !this.away() || opts.noSwitch) throw e;
      LS.set("use_away", !LS.get("use_away", false));
      try { const r = await this.api1(path, opts); toast(LS.get("use_away", false) ? "Connected away from home" : "Connected at home"); return r; }
      catch (e2) { LS.set("use_away", !LS.get("use_away", false)); throw e2; }
    }
  },
  async api1(path, opts = {}) {
    const base = this.base(); if (!base) throw new Error("No PC address");
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), opts.timeout || 8000);
    try {
      const r = await fetch(base + path, { method: opts.method || "GET", signal: ctl.signal,
        headers: Object.assign({ "Authorization": "Bearer " + this.token(), "X-Device": deviceName(), "X-Profile": encodeURIComponent(LS.get("profile", "")) }, opts.body ? { "Content-Type": "application/json" } : {}),
        body: opts.body ? JSON.stringify(opts.body) : undefined });
      if (r.status === 401) { setOnline(false); throw Object.assign(new Error("not paired"), { status: 401 }); }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
      setOnline(true);
      return opts.raw ? r : r.json();
    } catch (e) { if (e.status !== 401) setOnline(false); throw e; } finally { clearTimeout(t); }
  },
  url(path) { return this.base() + path + (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(this.token()); },
};
function deviceName() { const m = navigator.userAgent.match(/Android[^;]*;\s*([^;)]+)/); return LS.get("device", (m ? m[1].replace(/ Build.*/, "") : "Phone").slice(0, 40)); }
function setOnline(on) { S.online = on; const n = $("net"); n.textContent = on ? "synced" : "offline"; n.classList.toggle("ok", on); }

// ---------------------------------------------------------------- views
let view = "lib";
function show(v, title) {
  view = v;
  for (const id of ["connect", "lib", "book"]) $("v-" + id).classList.toggle("hide", id !== v);
  $("back").classList.toggle("hide", v !== "book"); $("logo").classList.toggle("hide", v === "book");
  $("player").classList.toggle("hide", v !== "book");
  $("title").textContent = title || "AudioScribe";
  window.scrollTo(0, 0);
}
$("back").onclick = () => closeBook();
window.addEventListener("popstate", () => { if (view === "book") closeBook(true); });

// ---------------------------------------------------------------- connect / pair
function showConnect(msg) {
  show("connect", "Connect");
  $("addr").value = LS.get("server", "") || (SAME_ORIGIN ? location.origin : "");
  $("addr").parentElement.querySelectorAll("#addr,#addr-l").forEach((e) => e.classList.toggle("hide", SAME_ORIGIN && !LS.get("server", "")));
  $("pair-msg").textContent = msg || "";
}
$("pair").onclick = async () => {
  let addr = $("addr").value.trim();
  if (addr && !/^https?:\/\//.test(addr)) addr = "http://" + addr;
  if (addr && !/:\d+\/?$/.test(addr.replace(/^https?:\/\//, "")) && !/:\d+\//.test(addr)) addr = addr.replace(/\/$/, "") + ":8765";
  if (addr) LS.set("server", addr.replace(/\/$/, ""));
  $("pair-msg").textContent = "Connecting…";
  try {
    const r = await fetch(S.base() + "/api/pair", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: $("code").value.trim(), device: deviceName() }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Couldn't connect");
    LS.set("token", d.token); $("code").value = ""; toast("Connected"); loadLibrary();
  } catch (e) { $("pair-msg").textContent = (e.message === "Failed to fetch" ? "Can't reach the PC. Is sharing on, and are you on the same Wi-Fi?" : e.message); }
};
$("skip").onclick = () => { LS.set("offline_only", true); loadLibrary(); };

// ---------------------------------------------------------------- library
let LIB = LS.get("library", []), SHELF = LS.get("shelf", "all"), DOWNLOADED = new Set();
const SHELVES = [["all", "All"], ["reading", "In progress"], ["down", "Downloaded"], ["audio", "Audio"], ["ebook", "Read only"], ["series", "Series"]];
async function loadLibrary() {
  show("lib");
  DOWNLOADED = new Set(await DB.keys("books"));
  drawLibrary();
  if (!S.token()) { if (!LS.get("offline_only", false)) return showConnect(); }
  else try {
    const d = await S.api("/api/library");
    LIB = d.books; LS.set("library", LIB); LS.set("offline_only", false);
    await syncAll();
    drawLibrary();
  } catch (e) {
    if (e.status === 401) return showConnect("This phone isn't paired any more - type the new code.");
    $("lib-msg").textContent = DOWNLOADED.size ? "Can't reach the PC - showing what's on this phone." : "Can't reach the PC. Turn on sharing in AudioScribe (Phone button), or download books while you're home.";
  }
}
function localP(b) { const st = LS.get("pos." + b.id, null); return st && (st.ts || 0) > (b.ts || 0) ? st.p || 0 : b.p || 0; }
function drawLibrary() {
  $("shelves").innerHTML = SHELVES.map(([id, l]) => `<button data-s="${id}" class="${id === SHELF ? "on" : ""}">${l}</button>`).join("");
  $("shelves").querySelectorAll("button").forEach((b) => b.onclick = () => { SHELF = b.dataset.s; LS.set("shelf", SHELF); drawLibrary(); });
  let list = LIB.slice();
  if (!S.online) list = list.filter((b) => DOWNLOADED.has(b.id)).concat(list.filter((b) => !DOWNLOADED.has(b.id)));
  list = list.filter((b) => SHELF === "all" || (SHELF === "reading" && localP(b) > 0 && localP(b) < 0.995) || (SHELF === "down" && DOWNLOADED.has(b.id))
    || (SHELF === "audio" && b.audio) || (SHELF === "ebook" && !b.audio) || (SHELF === "series" && b.series));
  if (SHELF === "series") list.sort((a, b) => (a.series + a.series_index.padStart(4, "0")).localeCompare(b.series + b.series_index.padStart(4, "0")));
  else if (SHELF === "reading") list.sort((a, b) => (LS.get("pos." + b.id, {}).ts || b.ts || 0) - (LS.get("pos." + a.id, {}).ts || a.ts || 0));
  $("books").innerHTML = list.map((b) => {
    const [bg, fg] = coverCols(b.title), p = localP(b), down = DOWNLOADED.has(b.id);
    const cov = S.online || down ? `<img class="cover" loading="lazy" data-cover="${b.id}" alt="" style="background:${bg}">` : `<div class="cover" style="background:${bg};color:${fg}">${esc(b.title)}</div>`;
    return `<div class="book" data-id="${b.id}">${cov}<div class="meta"><div class="t">${esc(b.title)}</div>
      <div class="muted small">${esc(b.author)}${b.series ? " · " + esc(b.series) + (b.series_index ? " #" + esc(b.series_index) : "") : ""}</div>
      <div style="margin-top:4px">${b.audio ? `<span class="tag">${fmt(b.duration)}</span>` : `<span class="tag">read</span>`}${down ? `<span class="tag on">on phone</span>` : ""}${b.renamed ? `<span class="tag on" title="${esc(b.renamed)}">&#9998; edited</span>` : ""}${p >= 0.995 ? `<span class="tag">finished</span>` : p > 0 ? `<span class="tag">${Math.round(p * 100)}%</span>` : ""}</div>
      <div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div></div></div>`; }).join("") || `<p class="muted">No books here yet.</p>`;
  $("books").querySelectorAll(".book").forEach((el) => el.onclick = () => openBook(el.dataset.id));
  $("books").querySelectorAll("img[data-cover]").forEach(loadCover);
}
const NOCOVER = new Set();
async function loadCover(img) {
  const id = img.dataset.cover; const b = LIB.find((x) => x.id === id) || {}; const [bg, fg] = coverCols(b.title);
  const fallback = () => { const d = document.createElement("div"); d.className = "cover"; d.style.background = bg; d.style.color = fg; d.textContent = b.title || ""; img.replaceWith(d); };
  const blob = await DB.get("covers", id).catch(() => null);
  if (blob) { img.src = URL.createObjectURL(blob); return; }
  if (!S.online || NOCOVER.has(id)) return fallback();
  img.onerror = () => { NOCOVER.add(id); fallback(); }; img.src = S.url("/api/cover/" + id);
}

// ---------------------------------------------------------------- downloads (books play without the PC)
function onMobileData() { const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection; return !!(c && (c.type === "cellular" || (c.saveData && c.type !== "wifi"))); }
function dlSizes() { return LS.get("dlsize", {}); }
function usedBytes() { let t = 0; const s = dlSizes(); for (const id of DOWNLOADED) t += s[id] || 0; return t; }
async function makeRoom(need) {
  // keep under the storage limit: remove finished books first (oldest finished first)
  const limit = (LS.get("store_limit_gb", 0) || 0) * 1073741824; if (!limit) return true;
  const fin = [...DOWNLOADED].filter((id) => { const b = LIB.find((x) => x.id === id); return b && localP(b) >= 0.995; });
  while (usedBytes() + need > limit && fin.length) { const id = fin.shift(); await removeDownload(id, true); }
  return usedBytes() + need <= limit;
}
async function download(id) {
  const b = LIB.find((x) => x.id === id) || BOOK;
  if (LS.get("wifi_only", true) && onMobileData()) return toast("On mobile data - downloads wait for Wi-Fi (change it under Storage).");
  const ui = sheet(`<h3>Downloading</h3><p class="muted small" id="dl-msg">${esc(b.title)}</p><div class="progress"><i id="dl-bar"></i></div>
    <p></p><button id="dl-cancel" style="width:100%">Cancel</button>`);
  let cancelled = false; $("dl-cancel").onclick = () => { cancelled = true; closeSheet(); };
  try {
    const data = await S.api("/api/book/" + id, { timeout: 60000 });
    const files = data.files.filter((f) => f.ok); let total = 0, done = 0, bytes = 0;
    for (const f of files) total += f.dur || 1;
    for (const f of files) {
      if (cancelled) return;
      const r = await fetch(S.url(`/api/audio/${id}/${f.n}`)); if (!r.ok) throw new Error("audio " + f.n);

};
$("more").onclick = () => {
  const inBook = view === "book" && BOOK, down = inBook && DOWNLOADED.has(BOOK.id), meta = inBook && LIB.find((b) => b.id === BOOK.id);
  sheet(`<div class="menu">
    ${inBook ? (down ? `<button data-a="rmdl">Remove from this phone</button>` : `<button data-a="dl" ${S.online ? "" : "disabled"}>Download to this phone</button>`) : ""}
    ${inBook && meta && meta.epub && S.online ? `<a href="${S.url("/api/epub/" + BOOK.id)}" download><button style="width:100%;text-align:left">Save the EPUB file</button></a>` : ""}
    ${inBook ? "" : `<button data-a="dlall" ${S.online ? "" : "disabled"}>Download books in progress</button>`}
    <button data-a="store">Storage…</button>
    <button data-a="sync">Sync now</button>
    <button data-a="theme">Colours: ${({ "": "follow the phone", light: "light", dark: "dark" })[LS.get("theme", "")]}</button>
    <button data-a="who">Who's reading: ${esc(LS.get("profile", "") || "main reader")}</button>
    <button data-a="addr">Addresses (home / away)…</button>
    <button data-a="pc">Change PC / pair again</button>
    <p class="muted small" style="margin:8px 4px 0">${S.base() ? "PC: " + esc(S.base()) + (LS.get("use_away", false) ? " (away)" : "") : "Not connected"} · ${esc(deviceName())}</p></div>`);
  $("sheet-body").querySelectorAll("button[data-a]").forEach((b) => b.onclick = async () => { const a = b.dataset.a; closeSheet();
    if (a === "dl") download(BOOK.id); else if (a === "rmdl") { await removeDownload(BOOK.id); }
    else if (a === "dlall") { for (const bk of LIB.filter((x) => localP(x) > 0 && localP(x) < 0.995 && !DOWNLOADED.has(x.id))) await download(bk.id); }
    else if (a === "sync") { await syncAll(); if (BOOK) await syncBook(); toast(S.online ? "Synced" : "Can't reach the PC"); if (view === "lib") loadLibrary(); }
    else if (a === "theme") { const order = ["", "light", "dark"]; const t = order[(order.indexOf(LS.get("theme", "")) + 1) % 3]; LS.set("theme", t); applyTheme(); }
    else if (a === "pc") { LS.set("token", ""); showConnect(); }
    else if (a === "addr") addrSheet();
    else if (a === "store") storageSheet();
    else if (a === "who") whoSheet(); });
};
async function whoSheet() {
  let names = [""];
  try { names = (await S.api("/api/profiles")).profiles || [""]; } catch (e) { return toast("Connect to the PC to switch readers."); }
  const cur = LS.get("profile", "");
  sheet(`<h3>Who's reading?</h3><p class="muted small">Each reader has their own places, bookmarks and stats. Add readers on the PC (the name button at the top).</p>
    <div class="menu">${names.map((n) => `<button data-p="${esc(n)}" class="${n === cur ? "accent" : ""}">${esc(n || "Main reader")}</button>`).join("")}</div>`);
  $("sheet-body").querySelectorAll("[data-p]").forEach((b) => b.onclick = async () => {
    const n = b.dataset.p; closeSheet(); if (n === cur) return;
    await syncAll();
    for (const k of Object.keys(localStorage)) if (/^as\.(state|pos|acc)\./.test(k)) localStorage.removeItem(k);
    LS.set("profile", n); toast("Reading as " + (n || "the main reader")); loadLibrary();
  });
}
async function storageSheet() {
  DOWNLOADED = new Set(await DB.keys("books"));
  const sz = dlSizes(), mb = (b) => (b / 1048576).toFixed(0) + " MB";
  let est = ""; try { const e = await navigator.storage.estimate(); est = `Phone storage used by AudioScribe: ${mb(e.usage || 0)}${e.quota ? " of " + mb(e.quota) + " allowed" : ""}.`; } catch (e) {}
  const rows = [...DOWNLOADED].map((id) => { const b = LIB.find((x) => x.id === id) || { title: id }; const fin = b.id && localP(b) >= 0.995;
    return `<div class="item"><span class="grow">${esc(b.title)}<br><span class="muted small">${mb(sz[id] || 0)}${fin ? " · finished" : ""}</span></span><button class="ghost small" data-rm="${id}">Remove</button></div>`; }).join("");
  const lim = LS.get("store_limit_gb", 0);
  sheet(`<h3>Storage</h3><p class="muted small">${DOWNLOADED.size} book(s) on this phone, ${mb(usedBytes())}. ${est}</p>
    <label class="small muted">Storage limit</label><div class="tabs">${[0, 1, 2, 5, 10, 20].map((g) => `<button data-lim="${g}" class="${g === lim ? "on" : ""}">${g ? g + " GB" : "No limit"}</button>`).join("")}</div>
    <div class="menu" style="margin:6px 0 12px">
      <button data-t="wifi_only">${LS.get("wifi_only", true) ? "☑" : "☐"} Download only on Wi-Fi</button>
      <button data-t="auto_remove">${LS.get("auto_remove", false) ? "☑" : "☐"} Remove books from the phone when I finish them</button></div>
    ${rows || '<p class="muted small">Nothing downloaded yet.</p>'}
    <p class="muted small">Over the limit, finished books are removed first. Your place and bookmarks stay - they're synced with the PC.</p>`);
  const body = $("sheet-body");
  body.querySelectorAll("[data-lim]").forEach((b) => b.onclick = async () => { LS.set("store_limit_gb", +b.dataset.lim); await makeRoom(0); storageSheet(); });
  body.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { LS.set(b.dataset.t, !LS.get(b.dataset.t, b.dataset.t === "wifi_only")); storageSheet(); });
  body.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => { await removeDownload(b.dataset.rm); storageSheet(); if (view === "lib") drawLibrary(); });
}
function addrSheet() {
  sheet(`<h3>Addresses</h3><div class="stack">
    <label class="small muted">At home (Wi-Fi)</label><input id="a-home" inputmode="url" value="${esc(S.home())}">
    <label class="small muted">Away from home (Tailscale) - optional</label><input id="a-away" inputmode="url" placeholder="http://100.x.y.z:8765" value="${esc(S.away())}">
    <p class="muted small" style="margin:0">The PC shows its Tailscale address under Phone when Tailscale is on. The app tries home first and switches by itself.</p>
    <button class="accent" id="a-save" style="width:100%">Save</button></div>`);
  $("a-save").onclick = () => { const fix = (v) => { v = v.trim(); if (v && !/^https?:\/\//.test(v)) v = "http://" + v; if (v && !/:\d+\/?$/.test(v)) v = v.replace(/\/$/, "") + ":8765"; return v.replace(/\/$/, ""); };
    const h = fix($("a-home").value), w = fix($("a-away").value);
    if (h && !(SAME_ORIGIN && h === location.origin)) LS.set("server", h);
    LS.set("away", w); LS.set("use_away", false); closeSheet(); toast("Saved"); loadLibrary(); };
}
function applyTheme() { const t = LS.get("theme", ""); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--side").trim(); }

// keyboard (tablets / Chromebooks)
addEventListener("keydown", (e) => { if (view !== "book" || e.target.tagName === "INPUT") return;
  const k = { " ": () => $("b-play").onclick(), ArrowLeft: () => $("b-back").onclick(), ArrowRight: () => $("b-fwd").onclick(), "[": () => $("b-prev").onclick(), "]": () => $("b-next").onclick() }[e.key];
  if (k) { e.preventDefault(); k(); } });

// ---------------------------------------------------------------- Android app: lock screen, notification, Android Auto
let nativeLast = 0, nativeBook = "";
function nativeUpdate(force) {
  if (!window.AndroidMedia || !BOOK) return;
  const now = Date.now(); if (!force && now - nativeLast < 1000) return; nativeLast = now;
  const msg = { bookId: BOOK.id, title: BOOK.title, author: BOOK.author || "", chapter: BOOK.chapters[CI].t, index: CI,
                playing: !!(tts ? tts.on : !audio.paused) };
  if (BOOK.timed && FILE >= 0) { const [a, b] = chapterSpan(CI); msg.position = Math.max(0, Math.round((bookTime() - a) * 1000)); msg.duration = Math.round((b - a) * 1000); }
  if (nativeBook !== BOOK.id) { msg.chapters = BOOK.chapters.map((c) => c.t); nativeBook = BOOK.id; }
  try { window.AndroidMedia.update(JSON.stringify(msg)); } catch (e) {}
}
window.nativeMedia = async (cmd, arg) => {
  if (!BOOK && (cmd === "play" || cmd === "resume") && LS.get("last_book", "")) {   // home-screen widget, app was closed
    await openBook(LS.get("last_book", "")); if (BOOK) play(); return;
  }
  if (!BOOK) return;
  if (cmd === "resume") cmd = "play";
  if (cmd === "play") play(); else if (cmd === "pause") pause();
  else if (cmd === "next") $("b-next").onclick(); else if (cmd === "prev") $("b-prev").onclick();
  else if (cmd === "fwd" && BOOK.timed) seekBook(bookTime() + 30); else if (cmd === "back" && BOOK.timed) seekBook(bookTime() - 30);
  else if (cmd === "seek" && BOOK.timed) { const [a] = chapterSpan(CI); seekBook(a + (+arg) / 1000); }
  else if (cmd === "chapter") goTo(+arg, IDX[+arg] && IDX[+arg][0] ? IDX[+arg][0].si : 0, true);
  else if (cmd === "sleep") { SLEEP = arg === "end" ? { chapter: true } : { until: Date.now() + (+arg) * 60000 }; toast(arg === "end" ? "Stops at the end of the chapter" : `Stops in ${arg} minutes`); }
  setTimeout(() => nativeUpdate(true), 300);
};
audio.addEventListener("play", () => nativeUpdate(true)); audio.addEventListener("pause", () => nativeUpdate(true));
audio.addEventListener("timeupdate", () => nativeUpdate(false));

// time spent listening / reading (for the stats on the PC)
let lastAct = Date.now();
for (const ev of ["scroll", "pointerdown", "keydown"]) addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true });
setInterval(() => {
  if (!BOOK || document.hidden && audio.paused && !tts) return;
  const a = LS.get("acc." + BOOK.id, { listened: 0, read: 0 });
  if (!audio.paused || tts) a.listened += 10; else if (view === "book" && Date.now() - lastAct < 120000) a.read += 10; else return;
  LS.set("acc." + BOOK.id, a);
}, 10000);
applyTheme();
setInterval(updateTimes, 1000);
if (!S.token() && !LS.get("offline_only", false)) showConnect(); else loadLibrary();
</script>
</body>
</html>
